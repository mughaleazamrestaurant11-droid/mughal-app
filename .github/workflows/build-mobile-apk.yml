# Builds the Mughal Traders mobile app (Android APK) in the cloud.
#
# Why this exists: the shop PC never needs Gradle, Android Studio or Java.
# Push the code to GitHub and this file builds the APK automatically;
# download it from the "Artifacts" area of the finished run.
#
# The Android project is located automatically, so this works whether the
# repository holds just the mobile app (project at the root) or the whole
# shop project (mobile app inside mughal_mobile/).

name: Build mobile APK

on:
  # Build as soon as anything is pushed...
  push:
    branches: ["**"]
  # ...and allow a manual build from the Actions tab.
  workflow_dispatch:

jobs:
  build-apk:
    name: Build the shop phone app
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Find the Android project
        id: proj
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f mughal_mobile/settings.gradle.kts ]; then
            echo "dir=mughal_mobile" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Android project (settings.gradle.kts) not found in this repository."
            echo "Repository contents:" && ls -la
            exit 1
          fi
          echo "Building in: $(cat "$GITHUB_OUTPUT")"

      - name: Set up Java 17 (only for the build machine, not for your PC)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # assembleDebug = the APK the shop installs (it is signed and installable).
      - name: Build the APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Give the APK a clear name
        run: |
          mkdir -p apk-out
          cp "${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" \
             "apk-out/MughalTraders-mobile-v${GITHUB_RUN_NUMBER}.apk"
          ls -l apk-out

      - name: Upload the APK (Actions page -> Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: MughalTraders-mobile-apk
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 90

  # On a version tag (v1, v2, ...) also attach the APK to a GitHub Release,
  # so the phone can download it from the Releases page without signing in
  # to GitHub Actions.
  release:
    name: Attach APK to a release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the built APK
        uses: actions/download-artifact@v4
        with:
          name: MughalTraders-mobile-apk
          path: apk-out

      - name: Create the release with the APK attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" apk-out/*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Mughal Traders mobile ${GITHUB_REF_NAME}" \
            --notes "Install this APK on the shop phones. The phone connects to the MAIN PC over the same WiFi - the main PC always holds the data."
